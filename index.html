<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTimer</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <header>
        <!-- Navigation Bar -->
        <nav class="nav-bar container">
            <!-- Logo -->
            <div class="tasktimer-logo container item">
                <img class="logo-img item" src="" alt="">
                <h1 class="logo-text item">TaskTimer</h1>
            </div>
            <!-- Navigation Links -->
            <div class="nav-links item">
                <ul class="nav-links-list container">
                    <li class="nav-link item"><a href="#">Add Task</a></li>
                    <li class="nav-link item"><a href="#">Task List</a></li>
                    <li class="nav-link item"><a href="#">Task Done</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Task Timer Features -->
    <main>
        <section class="add-task-section container">
            <h2 class="section-title">Add Task</h2>
            <form class="add-task-form container">
                <!-- Task Name and Duration -->
                <div class="task-name-duration container">
                    <!-- Task Name -->
                    <div class="container item">
                        <label class="item">Task Name</label>
                        <input type="text" class="task-input item" placeholder="Enter task name" required>
                    </div>
                    <!-- Duration -->
                    <div class="container item">
                        <label class="item">Duration (minutes)</label>
                        <input type="number" class="task-duration-input item" placeholder="Enter duration (minutes)"
                            required>
                    </div>
                </div>
                <!-- Task Description -->
                <div class="container item">
                    <label class="item">Task Description</label>
                    <input type="text" class="task-desc-input item" placeholder="Enter task description" required>
                </div>
                <!-- Task Add Sumbit Button -->
                <button type="submit" class="add-task-btn btn item">Add Task</button>
            </form>
        </section>

    </main>
    <footer>
        <p class="footer-text">&copy; Cedrex Pelagio. All rights reserved.</p>
    </footer>
</body>

</html>
